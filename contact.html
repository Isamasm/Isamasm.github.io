<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Isamasm - System Administrator and Infrastructure Specialist.">
    <title>Contact - Isamasm</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Isamasm</h1>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="interests.html">Interests</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </header>
        
        <main class="page">
            <section>
                <h2>Contact</h2>
                <p>
                    Feel free to reach out for collaborations, questions about system administration, 
                    infrastructure discussions, or just to connect.
                </p>
            </section>

            <section class="contact-icons">
                <a href="https://www.linkedin.com/in/isam-aitsim-barek-4a6097343" class="contact-icon-link" title="LinkedIn">
                    <div class="contact-icon">
                        <i class="fab fa-linkedin"></i>
                        <span>LinkedIn</span>
                    </div>
                </a>
                <a href="https://x.com/laszlo_00" class="contact-icon-link" title="X/Twitter">
                    <div class="contact-icon">
                        <i class="fab fa-twitter"></i>
                        <span>X/Twitter</span>
                    </div>
                </a>
                <a href="mailto:isamaitsimbarek@gamil.com" class="contact-icon-link" title="Email">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                        <span>Email</span>
                    </div>
                </a>
                <a href="https://discordapp.com/users/laszlo_016" class="contact-icon-link" title="Discord">
                    <div class="contact-icon">
                        <i class="fab fa-discord"></i>
                        <span>Discord</span>
                    </div>
                </a>
            </section>

            <section class="contact-form">
                <h3>Send me a message</h3>
                <form action="https://formspree.io/f/mleznjgo" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Your email">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required placeholder="Your message" rows="5"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </section>
        </main>
    </div>
    
    <footer>
        <div class="footer-content">
            <div class="footer-name">Isamasm</div>
            <div class="footer-nav">
                <a href="/">Home</a>
                <a href="projects.html">Projects</a>
                <a href="interests.html">Interests</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="footer-social">
                <a href="https://www.linkedin.com/in/isam-aitsim-barek-4a6097343" class="social-link" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://x.com/laszlo_00" class="social-link" title="X/Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="mailto:isamaitsimbarek@gamil.com" class="social-link" title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
